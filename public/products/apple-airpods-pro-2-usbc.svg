<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <!-- Specimen Backdrop -->
  <rect x="0" y="0" width="360" height="220" rx="8" fill="#F2EBD8"/>
  <rect x="4" y="4" width="352" height="212" rx="6" fill="#FBF7EA" stroke="#1B1A17" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Docket -->
  <text x="16" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#8A8576" letter-spacing="1">
    FIG 2.0 — APPLE-AIRPODS-PRO-2-USBC
  </text>
  <rect x="250" y="12" width="94" height="14" rx="2" fill="#1F6B4F" fill-opacity="0.1" stroke="#1F6B4F" stroke-width="1"/>
  <text x="297" y="22" font-family="monospace" font-size="8" font-weight="bold" fill="#1F6B4F" text-anchor="middle">
    TRUE WIRELESS
  </text>

  <!-- Charging Case Silhouette -->
  <rect x="100" y="60" width="160" height="105" rx="34" fill="#F2EBD8" stroke="#1B1A17" stroke-width="2.5"/>
  <path d="M 100 102 C 140 100, 220 100, 260 102" fill="none" stroke="#1B1A17" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="180" cy="120" r="4" fill="#1F6B4F"/>

  <!-- Left Earbud Specimen -->
  <g transform="translate(45, 58) scale(0.9)">
    <circle cx="28" cy="30" r="18" fill="#FBF7EA" stroke="#1B1A17" stroke-width="2.5"/>
    <rect x="24" y="42" width="8" height="42" rx="4" fill="#1B1A17"/>
    <circle cx="28" cy="28" r="7" fill="#2540D9" fill-opacity="0.2"/>
  </g>

  <!-- Right Earbud Specimen -->
  <g transform="translate(255, 58) scale(0.9)">
    <circle cx="28" cy="30" r="18" fill="#FBF7EA" stroke="#1B1A17" stroke-width="2.5"/>
    <rect x="24" y="42" width="8" height="42" rx="4" fill="#1B1A17"/>
    <circle cx="28" cy="28" r="7" fill="#2540D9" fill-opacity="0.2"/>
  </g>

  <!-- Brand Typography -->
  <text x="180" y="145" font-family="monospace" font-size="12" font-weight="bold" fill="#1B1A17" text-anchor="middle" letter-spacing="2">
