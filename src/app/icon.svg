<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Archival Deep Ink Container -->
  <rect width="32" height="32" rx="7" fill="#1B1A17"/>
  
  <!-- Subtle Paper Stamp Border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#F3C94B" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  
  <!-- Left Stroke of 'V' (Paper Sheet White) -->
  <path d="M 6.5 7 L 12 7 L 16 18.5 L 13.5 25 Z" fill="#FBF7EA"/>
  
  <!-- Right Stroke of 'V' (Carbon Blue) -->
  <path d="M 16 18.5 L 20 7 L 25.5 7 L 18.5 25 L 13.5 25 Z" fill="#2540D9"/>
  
  <!-- Vermilion Stamp Tick / Audit Dot -->
  <circle cx="24.5" cy="7.5" r="2.2" fill="#D8381C"/>
</svg>
